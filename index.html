<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECHELON — 統合プロトタイプ</title>
    <!--
      書体(`[v6.6]` UIレビュー)。見出しとラベルは condensed、本文は日本語、
      数値は等幅。取得できなければ styles.css の font stack が system-ui へ落ちるので、
      オフラインでもレイアウトは崩れない(字幅だけが変わる)。

      **描画を止めない読み込み方にすること。** 素直に `rel="stylesheet"` で置くと、
      ネットワークが無い環境ではこのリクエストがタイムアウトするまで画面が
      真っ白のままになる(ヘッドレスで実際に踏んだ)。`media="print"` で
      非ブロッキングに落とし、読み終わってから適用する。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
